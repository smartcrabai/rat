name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]


jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v taplo &> /dev/null; then
            curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
              | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          fi

      - name: Lint Cargo.toml
        if: runner.os == 'Linux'
        shell: bash
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        if: runner.os == 'Linux'
        shell: bash
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        shell: bash
        run: cargo fmt -- --check

      - name: Run tests
        shell: bash
        run: cargo test --all-features

      - name: Install Bats
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes bats
          else
            brew install bats-core
          fi

      - name: Build CLI for E2E tests
        shell: bash
        run: cargo build --bin rat

      - name: Run Bats E2E tests
        shell: bash
        run: bats tests/e2e.bats

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings
  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Quint
        run: npm ci

      - name: Typecheck scheduler model
        run: npm run typecheck

      - name: Run scheduler scenario tests
        run: npm test

      - name: Simulate scheduler model
        run: npm run run

      - name: Bounded scheduler verification
        run: npm run verify



  automerge:
    runs-on: ubuntu-latest
    needs: [test, formal]
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
